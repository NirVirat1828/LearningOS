<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearningOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore the path encoded by public/404.html's SPA-fallback redirect.
      (function (l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(3).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded[0] + (window.location.hash || '')
          )
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
