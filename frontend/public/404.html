<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LearningOS</title>
    <script>
      // Single Page App GitHub Pages fallback: encode the current path into
      // a query string and redirect to the app root, where index.html's
      // inline script restores it via history.replaceState before React mounts.
      var pathSegmentsToKeep = 1; // keeps "/LearningOS"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
